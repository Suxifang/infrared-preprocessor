name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Numerical and UI tests
        run: python -X utf8 -m pytest tests -q
      - name: Build desktop application
        shell: pwsh
        run: ./build.ps1 -Python (Get-Command python).Source
      - name: Test packaged desktop
        shell: pwsh
        run: |
          $folder = Join-Path $PWD 'ci-smoke'
          $process = Start-Process -FilePath './发布/红外预处理/红外预处理.exe' -ArgumentList @('--smoke-test', ('"' + $folder + '"')) -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(60000)) { throw 'Packaged smoke test timed out' }
          $process.Refresh()
          Write-Host "Packaged process exit code: $($process.ExitCode)"
          if (Test-Path -LiteralPath 'ci-smoke/smoke.json') {
            Get-Content -LiteralPath 'ci-smoke/smoke.json' -Raw
          }
          $startupError = Join-Path $env:TEMP 'infrared-preprocess-error.txt'
          if (Test-Path -LiteralPath $startupError) {
            Get-Content -LiteralPath $startupError -Raw
          }
          if ($process.ExitCode -ne 0) { throw 'Packaged smoke test failed; see diagnostic report above' }
          $report = Get-Content -LiteralPath 'ci-smoke/smoke.json' -Raw | ConvertFrom-Json
          if (!$report.ok) { throw 'Packaged smoke report did not pass' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-diagnostics
          path: ci-smoke/
          if-no-files-found: ignore
      - name: Package ZIP and integrity manifest
        run: python -X utf8 tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: infrared-preprocessor-windows
          path: 发布/更新包/*
      - name: Publish tagged test release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag ./发布/更新包/* --title "红外预处理 $tag 测试版" --notes-file CHANGELOG.md --prerelease --verify-tag
